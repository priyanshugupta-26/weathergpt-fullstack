services:
  - type: web
    name: weathergpt-fullstack
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        value: sqlite:////app/data/weathergpt.db
      - key: SCHEDULER_ENABLED
        value: "true"
      - key: TRUSTED_MODELS
        value: "false"
